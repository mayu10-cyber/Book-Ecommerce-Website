<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNook - Welcome</title>
    <style>
        /* Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* New full white background */
            background-color: #ffffff;
            font-family: 'Garamond', 'Georgia', serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
            overflow: hidden;
        }
        
        /* The main content box with new gradient border */
        .scene {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: #00000032;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.495);
            position: relative;
            /* Gradient border effect */
            border: 4px solid transparent;
            background-clip: padding-box;
            -webkit-background-clip: padding-box;
            background-image: #ffff;
            background-origin: border-box;
            background-repeat: no-repeat;
        }

        /* ----- 3D Book Styling (Recolored for contrast) ----- */
        .book-3d {
            width: 200px;
            height: 300px;
            transform-style: preserve-3d;
            animation: zoomInOut 8s ease-in-out infinite;
            margin-bottom: 40px;
        }

        .book-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .book-cover {
            /* New book color to stand out on white */
            background: linear-gradient(-45deg, #e8a997, #f3b3cc, #b7e2f2, #cbf8ee);
            border-radius: 4px 20px 20px 4px;
            transform: translateZ(15px);
            display: flex;
            justify-content: center;
            border: 1px solid #0000008f;
            align-items: center;
            /* Text on book is now white */
            color: #ffffff;
            font-size: 2rem;
            font-weight: bold;
        }
        
        .book-back { background: #d8dee9; border-radius: 20px 4px 4px 20px; transform: rotateY(180deg) translateZ(15px); }
        .book-spine { width: 30px; height: 100%; background: #3b4864; transform: rotateY(-90deg) translateX(-15px); transform-origin: left; }

        /* ----- Title and Subtitle (Recolored for contrast) ----- */
        .title {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn-up 1.5s ease-out 1s forwards;
        }

        h1 {
            font-size: 3.5rem;
            /* New dark text color */
            color: #333333;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1.2rem;
            /* New softer dark text color */
            color: #000000;
            font-style: italic;
        }

        /* ----- Loader (Recolored) ----- */
        .loader {
            width: 250px;
            height: 4px;
            background-color: #f0f0f0;
            margin-top: 40px;
            border-radius: 4px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 1s ease-in 2s forwards;
        }

        .loader-bar {
            width: 0;
            height: 100%;
            /* New loader color */
            background: linear-gradient(90deg, #e73c7e, #23a6d5);
            transition: width 3.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* ----- Keyframe Animations ----- */
        @keyframes zoomInOut { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }
        @keyframes fadeIn-up { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }

        /* ----- Responsive Design ----- */
        @media (max-width: 600px) {
            .scene { width: 90%; padding: 20px;}
            .book-3d { width: 150px; height: 225px; }
            .book-cover { font-size: 1.5rem; }
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="book-3d">
            <div class="book-face book-cover">BookNook</div>
            <div class="book-face book-spine"></div>
            <div class="book-face book-back"></div>
        </div>
        
        <div class="title">
            <h1>BookNook</h1>
            <p class="subtitle">Your Literary Escape</p>
        </div>
        
        <div class="loader">
            <div class="loader-bar" id="loaderBar"></div>
        </div>
    </div>

    <script>
        // Script for loader and redirect
        setTimeout(() => {
            const loaderBar = document.getElementById('loaderBar');
            if (loaderBar) {
                loaderBar.style.width = '100%';
            }
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3500);
        }, 2500);
    </script>
</body>
</html>
